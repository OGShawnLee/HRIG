version: '3'

tasks:
  client:check:
    dir: app
    cmds:
      - wails3 task check

  client:build:
    dir: app
    cmds:
      - wails3 task build

  client:start:
    dir: app
    cmds:
      - wails3 task start

  client:dev:
    dir: app
    cmds:
      - wails3 task dev

  client:bindings:
    dir: app
    cmds:
      - wails3 task bindings

  server:check:
    dir: server
    cmds:
      - go vet ./...
      - go test ./...
      - go build -o ../bin/hrig-server{{exeExt}} ./cmd/server

  server:test:
    dir: server
    cmds:
      - go test -v ./...

  server:build:
    dir: server
    cmds:
      - go build -o ../bin/hrig-server{{exeExt}} ./cmd/server

  server:dev:
    dir: server
    cmds:
      - go run ./cmd/server

  server:start:
    cmds:
      - task: server:build
      - ./bin/hrig-server{{exeExt}}

  db:start:
    platforms: [windows]
    cmds:
      - ./local/pgsql/bin/pg_ctl.exe -D ./local/pgsql/data -l ./local/pgsql/logfile -o "-h 127.0.0.1 -p 5432" start

  db:stop:
    platforms: [windows]
    cmds:
      - ./local/pgsql/bin/pg_ctl.exe -D ./local/pgsql/data stop -m fast

  db:status:
    platforms: [windows]
    cmds:
      - ./local/pgsql/bin/pg_ctl.exe -D ./local/pgsql/data status

  db:psql:
    platforms: [windows]
    cmds:
      - ./local/pgsql/bin/psql.exe -h 127.0.0.1 -p 5432 -U postgres -d hrig

  db:sqlc:
    cmds:
      - sqlc generate
